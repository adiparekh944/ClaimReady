services:
  - type: web
    name: claimready-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: GEMINI_API_KEY
        sync: false
      - key: CLAIMREADY_API_KEY
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: 10
      - key: MAX_IMAGE_PIXELS
        value: 40000000
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
