[pytest]
# `tests/` only. The legacy `test_*.py` scripts at the repository root and in
# `backend/` are integration scripts that POST against a running server; they
# have no assertions a runner can use and would fail without live services.
testpaths = tests
python_files = test_*.py
addopts = --strict-markers -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
